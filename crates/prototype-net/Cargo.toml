[package]
name = "prototype-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
prototype-assets = { version = "0.1.0", path = "../prototype-assets" }
prototype-i18n = { version = "0.1.0", path = "../prototype-i18n" }
prototype-llsd = { version = "0.1.0", path = "../prototype-llsd" }
prototype-msg = { version = "0.1.0", path = "../prototype-msg" }
prototype-prim = { version = "0.1.0", path = "../prototype-prim" }
prototype-version = { version = "0.1.0", path = "../prototype-version" }
base64 = "0.23.1"
bitflags = "2.13.2"
crossbeam-channel = "0.5.17"
glam = "0.34.1"
log = "0.4.34"
md5 = "0.8.1"
parking_lot = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
webpki-root-certs = "1.0.9"

[lints]
workspace = true
